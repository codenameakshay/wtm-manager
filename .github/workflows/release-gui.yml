# Builds WTM.app (the crates/wtm-gui desktop app) and attaches it to the
# same GitHub Release that .github/workflows/release.yml (dist-generated)
# creates for the wtm CLI.
#
# This is a hand-written workflow, not something `dist generate` produces or
# manages — see the comment above `[dist]` in dist-workspace.toml for why
# dist's own `extra-artifacts` mechanism doesn't fit here (its build command
# always runs on the ubuntu-22.04 "global artifacts" runner, but WTM.app
# needs to be built on macOS).
#
# It triggers on `workflow_run` completion of the "Release" workflow rather
# than the same tag push, because:
#   - there's no `needs:` dependency across separate workflow files, and
#   - the GitHub Release has to already exist before `gh release upload` can
#     attach an asset to it.
# `workflow_run` fires only after every job in "Release" has finished
# (plan -> build-local-artifacts -> build-global-artifacts -> host ->
# announce), so by the time this runs, `host` has already created the
# release if it was going to.
#
# NOTE for maintainers: `workflow_run` subscriptions only activate once this
# file exists on the repository's default branch (main) — GitHub resolves
# `workflows: ["Release"]` against the default branch's workflow files, not
# whatever branch/PR this was authored on. The first real release after this
# merges is the first one that will get a WTM.app attached.
name: Release GUI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-gui-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Build and upload WTM.app
    runs-on: macos-latest
    env:
      # job-level, matching how release.yml (dist-generated) scopes this —
      # not the workflow-level `env:` above, to keep `secrets.*` usage
      # exactly where the rest of this repo's release tooling already puts it.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Only proceed for a *successful* "Release" run that was itself
    # triggered by a tag push, not the `pull_request:`-triggered `dist plan`
    # dry runs that release.yml also runs on every PR. release.yml's only
    # `push` trigger is the version-tag pattern, so `event == 'push'` here
    # always means `head_branch` is a release tag, never a plain branch.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Own prefix: this is a --release build, unlike the debug build the
          # `gui` CI job caches under "gui-v1" in ci.yml. Keeping them apart
          # avoids thrashing one cache between debug and release artifacts.
          prefix-key: "release-gui-v1"

      - name: Determine release tag
        id: tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: echo "tag=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      # No --sign identity: scripts/bundle-mac.sh ad-hoc signs by default
      # when one isn't given (its own comment on the codesign call explains
      # why — Apple Silicon needs *a* signature just to launch the binary at
      # all, but ad-hoc has no certificate chain and is not a substitute for
      # a real Developer ID signature plus notarization). The "Note signing
      # status" step below says so explicitly on the release, rather than
      # letting the bare "WTM-macOS.zip" filename imply otherwise.
      - name: Build WTM.app
        run: bash scripts/bundle-mac.sh --release --output target/bundle

      # `ditto`, not `zip -r`: it preserves the .app bundle's resource
      # forks, extended attributes and code signature, which a plain `zip`
      # can silently corrupt.
      - name: Zip WTM.app
        run: ditto -c -k --sequesterRsrc --keepParent target/bundle/WTM.app WTM-macOS.zip

      - name: Upload WTM-macOS.zip to the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" WTM-macOS.zip --clobber

      # Keep the release honest about what "WTM-macOS.zip" actually is.
      # Idempotent: skips if a previous run (e.g. a re-run of this workflow)
      # already appended the note.
      - name: Note signing status on the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          marker="<!-- wtm-gui-signing-note -->"
          notes="$(gh release view "$TAG" --json body -q .body)"
          if [[ "$notes" == *"$marker"* ]]; then
            echo "Signing note already present on release $TAG, skipping."
            exit 0
          fi
          {
            printf '%s\n' "$notes"
            echo
            echo "---"
            echo "$marker"
            echo "**macOS app (\`WTM-macOS.zip\`):** ad-hoc signed, not notarized by Apple. After unzipping, right-click \`WTM.app\` and choose **Open** the first time to get past Gatekeeper's unidentified-developer warning."
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
