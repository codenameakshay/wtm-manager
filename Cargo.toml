# The GUI lives in its own workspace member so the CLI never pays for it.
# `default-members` keeps bare `cargo build`/`cargo test`/`cargo clippy` (and
# therefore every existing CI gate, including the Linux one) scoped to the
# `wtm` package alone — gpui is only compiled when a command explicitly asks
# for `-p wtm-gui`.
[workspace]
members = ["crates/wtm-gui"]
default-members = ["."]
resolver = "2"

[package]
name = "wtm"
version = "0.4.0"
edition = "2021"
description = "A fast, ergonomic Git worktree manager"
repository = "https://github.com/codenameakshay/wtm-manager"
license = "MIT OR Apache-2.0"
keywords = ["git", "worktree", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

[lib]
name = "wtm"
path = "src/lib.rs"

[[bin]]
name = "wtm"
path = "src/main.rs"

[[bench]]
name = "list"
harness = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive"] }
clap_complete = "4.6.7"
comfy-table = "7.2.2"
crossterm = "0.29.0"
directories = "6.0.0"
git2 = { version = "0.21.0", default-features = false }
inquire = "0.9.4"
libc = "0.2.186"
owo-colors = "4.3.0"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.3"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
criterion = "0.8.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
