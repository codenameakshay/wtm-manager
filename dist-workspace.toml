[workspace]
members = ["cargo:."]

# crates/wtm-gui (the GPUI desktop app) is deliberately NOT a member here.
# It's `publish = false`, so it isn't a "dist-able" Rust package in dist's
# sense regardless of platform. Its release artifacts — a zipped WTM.app on
# macOS, and a tarball + .deb per architecture on Linux — are built and
# attached to the same GitHub Release by .github/workflows/release-app.yml
# (formerly release-gui.yml, renamed once Linux packaging joined macOS in
# it), a small hand-written workflow that triggers via `workflow_run` once
# this dist-generated pipeline finishes.
#
# `[dist.extra-artifacts]` was considered and rejected for this: dist treats
# extra-artifacts as a *global* artifact (see `add_extra_artifacts` in
# cargo-dist's tasks.rs), so its `build` command always runs in the single
# `build-global-artifacts` job — which this repo's generated release.yml
# pins to `ubuntu-22.04` regardless of `targets` below. There's no
# extra-artifacts-scoped way to fan that one command out across macOS *and*
# multiple Linux architectures; the only lever is
# `[dist.github-custom-runners]`, which controls dist's *own* per-target
# build runners (for the `wtm` CLI targets below), not an extra-artifacts
# command. Moving the whole global job to a different runner just to
# accommodate optional wtm-gui assets would be a bigger blast radius than
# this needs, hence the separate hand-written workflow instead.
#
# Note: the Linux targets in `targets` below (x86_64/aarch64-unknown-linux-
# gnu) already give dist everything it needs to build the `wtm` *CLI*
# binary for Linux — that part needs no change here. They do not cover
# wtm-gui, which release-app.yml packages separately via
# scripts/package-linux.sh on native ubuntu-latest/ubuntu-24.04-arm runners.
#
# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# Homebrew is intentionally omitted for now — there's no published tap yet, so
# a generated formula would only advertise a `brew install` that doesn't work.
# To add it later: set installers to ["shell", "homebrew"], add
# `tap = "codenameakshay/homebrew-tap"` (create that repo first) and
# `publish-jobs = ["homebrew"]`, then re-run `dist generate`.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
