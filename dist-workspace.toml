[workspace]
members = ["cargo:."]

# crates/wtm-gui (the GPUI desktop app, WTM.app) is deliberately NOT a member
# here. It's `publish = false` and macOS-only, so it isn't a "dist-able"
# Rust package in dist's sense. Its release artifact (a zipped WTM.app) is
# built and attached to the same GitHub Release by
# .github/workflows/release-gui.yml, a small hand-written workflow that
# triggers via `workflow_run` once this dist-generated pipeline finishes.
#
# `[dist.extra-artifacts]` was considered and rejected for this: dist treats
# extra-artifacts as a *global* artifact (see `add_extra_artifacts` in
# cargo-dist's tasks.rs), so its `build` command always runs in the
# `build-global-artifacts` job — which this repo's generated release.yml
# pins to `ubuntu-22.04` regardless of `targets` below. There's no
# extra-artifacts-scoped way to force just that one command onto macOS; the
# only lever is `[dist.github-custom-runners] global = "macos-latest"`,
# which would move dist's *entire* global job (shell installer generation,
# manifest stitching, checksums, SBOMs, ...) onto macOS for every release
# just to accommodate one optional asset. That's a bigger blast radius than
# this needs, hence the separate workflow instead.
#
# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# Homebrew is intentionally omitted for now — there's no published tap yet, so
# a generated formula would only advertise a `brew install` that doesn't work.
# To add it later: set installers to ["shell", "homebrew"], add
# `tap = "codenameakshay/homebrew-tap"` (create that repo first) and
# `publish-jobs = ["homebrew"]`, then re-run `dist generate`.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
